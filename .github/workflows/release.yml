name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and publish package
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        run: uv publish
